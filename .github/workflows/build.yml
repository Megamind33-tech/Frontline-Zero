name: Verify and build Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .tools
          key: godot-4.7.2-linux-v1
      - run: bash scripts/bootstrap.sh
      - run: bash scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: dist/
  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
      - uses: actions/cache@v4
        with:
          path: .tools
          key: godot-4.7.2-templates-v1
      - run: bash scripts/bootstrap.sh --templates
      - run: bash scripts/android-build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-and-evidence
          path: |
            dist/*.apk
            dist/android-export.log
